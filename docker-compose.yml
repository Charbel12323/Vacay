services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: subtracker
      POSTGRES_PASSWORD: subtracker
      POSTGRES_DB: subtracker
    ports:
      # 5433 on the host to avoid clashing with any locally installed Postgres.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subtracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
