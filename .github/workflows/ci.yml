name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: subtracker
          POSTGRES_PASSWORD: subtracker
          POSTGRES_DB: subtracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U subtracker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://subtracker:subtracker@localhost:5432/subtracker
      REDIS_URL: redis://localhost:6379
      PLAID_CLIENT_ID: ci-placeholder
      PLAID_SECRET: ci-placeholder
      PLAID_ENV: sandbox
      TOKEN_ENC_KEY: ci-placeholder-key-0123456789abcdef
      RESEND_API_KEY: ci-placeholder
      AUTH_SECRET: ci-placeholder-auth-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Apply migrations
        run: npm run db:migrate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
